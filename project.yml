# XcodeGen manifest for PoC.xcodeproj.
#
# XcodeGen is NOT installed here, so this file cannot be run locally and
# project.pbxproj cannot be regenerated from it.  It is kept as the statement of
# intent for the project, and `- path: Nugget` below is deliberately the same
# source root Package.swift declares.
#
# Package.swift is the single source of truth for the source list.  After adding
# or removing a file under Nugget/, run:
#
#     scripts/sync-pbxproj-sources.py
#
# which asks SwiftPM what the target resolves and reconciles project.pbxproj to
# match.  If XcodeGen ever becomes available, regenerating from this file and
# then running that script must leave project.pbxproj unchanged.
name: PoC
options:
  bundleIdPrefix: com.awesomenull
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Minimuxer:
    path: Vendor

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: layout/Applications/PoC.app/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.awesomenull.poc
    PRODUCT_NAME: PoC
    CODE_SIGN_ENTITLEMENTS: entitlements.plist
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  PoC:
    type: application
    platform: iOS
    sources:
      - path: Nugget
      # App icons must live at the bundle root (CFBundleIconFiles expects them there)
      - path: layout/Applications/PoC.app/AppIcon60x60@2x.png
        buildPhase: resources
      - path: layout/Applications/PoC.app/AppIcon76x76@2x~ipad.png
        buildPhase: resources
    dependencies:
      - package: Minimuxer
        product: Minimuxer
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS:
          - "-framework"
          - "UIKit"

schemes:
  PoC:
    build:
      targets:
        PoC: all
    run:
      config: Debug
